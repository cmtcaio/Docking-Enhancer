name: Build Odin Xbox fix

on:
  push:
    branches: [fix/odin-xbox-same-name]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already ships the Android command-line SDK.
      # setup-android@v3 tries to install the obsolete "tools" package and fails.
      - name: Install Android platform 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER" || { echo "Android sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :domain:test :data:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: docking-enhancer-odin-xbox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
